sonar.projectKey=oboapp_sources
sonar.projectName=Obo sources
sonar.organization=oboapp
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Analyze package TypeScript once, excluding both generated module formats.
sonar.sources=packages
sonar.inclusions=packages/*/src/**/*.ts
sonar.exclusions=**/*.d.ts,**/dist/**,**/node_modules/**,**/test/**,**/coverage/**

sonar.tests=packages
sonar.test.inclusions=packages/*/test/**/*.test.ts
sonar.test.exclusions=**/fixtures/**,**/dist/**,**/node_modules/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
