sonar.projectKey=oboapp_sources
sonar.projectName=Obo sources
sonar.organization=oboapp
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Analyze package TypeScript and CI workflows, excluding generated module formats.
sonar.sources=packages,.github/workflows
sonar.inclusions=packages/*/src/**/*.ts,.github/workflows/*.yml
sonar.exclusions=**/*.d.ts,**/dist/**,**/node_modules/**,**/test/**,**/coverage/**

sonar.tests=packages
sonar.test.inclusions=packages/*/test/**/*.test.ts
sonar.test.exclusions=**/fixtures/**,**/dist/**,**/node_modules/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=.github/workflows/*.yml
